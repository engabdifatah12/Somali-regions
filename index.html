<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Somali Regions & Capitals</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="hero">
    <div class="container">
      <h1>So Somali Regions & Capitals</h1>
      <p>
        Explore the regions of Somalia and their respective capitals.
      </p>
    </div>
  </header>

  <main class="container">
    <section class="search-section">
      <label for="searchInput">Search Region</label>
      <input
        type="search"
        id="searchInput"
        placeholder="Search by region or capital..."
      />
    </section>

    <section>
      <h2>Regions of Somalia</h2>

      <div id="regionsContainer" class="regions-grid">
        <!-- Region cards will be added with JavaScript -->
      </div>

      <p id="noResults" class="no-results hidden">
        No region found.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Somali Regions & Capitals</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
