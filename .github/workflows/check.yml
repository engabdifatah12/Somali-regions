name: Somali Regions Project Check

on: push

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Greet and count files
        env:
          STUDENT_NAME: ${{ vars.STUDENT_NAME }}
        run: |
          COUNT=$(find . -type f -not -path './.git/*' | wc -l)

          echo "Hello $STUDENT_NAME"
          echo "Your Somali Regions project has $COUNT files."